[project]
name = "clinassist"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chromadb==0.5.23",
    "fastapi>=0.156.8",
    "groq>=0.37.1",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "openai-whisper>=20250625",
    "pillow>=13.0.0",
    "posthog<6",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "pypdf==5.1.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sentence-transformers==3.3.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers==4.46.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
